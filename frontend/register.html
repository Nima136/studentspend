<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | StudentSpend</title>

    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/auth.css">

</head>

<body>

    <div class="auth-page">

        <!-- LEFT SIDE -->

        <div class="auth-info">

            <a href="index.html" class="auth-logo">
                Student<span>Spend</span>
            </a>

            <div class="auth-info-content">

                <p class="auth-label">
                    GET STARTED
                </p>

                <h1>
                    Start managing
                    <br>
                    your money.
                </h1>

                <p>
                    Create your account and start tracking
                    your spending today.
                </p>

            </div>

        </div>


        <!-- RIGHT SIDE -->

        <div class="auth-container">

            <div class="auth-card register-card">

                <div class="mobile-logo">

                    <a href="index.html" class="auth-logo">
                        Student<span>Spend</span>
                    </a>

                </div>


                <div class="auth-heading">

                    <h2>
                        Create your account
                    </h2>

                    <p>
                        It only takes a minute to get started.
                    </p>

                </div>


                <!-- REGISTER FORM -->

                <form id="registerForm">


                    <div class="form-group">

                        <label for="name">
                            Full name
                        </label>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            placeholder="Your name"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="registerEmail">
                            Email address
                        </label>

                        <input
                            type="email"
                            id="registerEmail"
                            name="email"
                            placeholder="you@example.com"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="college">
                            College / University
                        </label>

                        <input
                            type="text"
                            id="college"
                            name="college"
                            placeholder="Your college"
                            required
                        >

                    </div>


                    <div class="form-row">

                        <div class="form-group">

                            <label for="password">
                                Password
                            </label>

                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Create password"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label for="confirmPassword">
                                Confirm password
                            </label>

                            <input
                                type="password"
                                id="confirmPassword"
                                name="confirmPassword"
                                placeholder="Repeat password"
                                required
                            >

                        </div>

                    </div>


                    <div class="form-group">

                        <label for="allowance">
                            Monthly allowance / income
                        </label>

                        <div class="input-with-symbol">

                            <span>₹</span>

                            <input
                                type="number"
                                id="allowance"
                                name="allowance"
                                placeholder="15000"
                                min="0"
                            >

                        </div>

                    </div>


                    <button
                        type="submit"
                        class="auth-button"
                    >
                        Create Account
                    </button>

                </form>


                <p class="auth-switch">

                    Already have an account?

                    <a href="login.html">
                        Login
                    </a>

                </p>

            </div>

        </div>

    </div>


    <script src="js/auth.js"></script>

</body>

</html>
