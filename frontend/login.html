<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | StudentSpend</title>

    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/auth.css">

</head>

<body>

    <div class="auth-page">

        <!-- LEFT SIDE -->

        <div class="auth-info">

            <a href="index.html" class="auth-logo">
                Student<span>Spend</span>
            </a>

            <div class="auth-info-content">

                <p class="auth-label">
                    WELCOME BACK
                </p>

                <h1>
                    Your money.
                    <br>
                    Your control.
                </h1>

                <p>
                    Keep track of your expenses, stay within
                    your budget, and make smarter financial
                    decisions.
                </p>

            </div>

        </div>


        <!-- RIGHT SIDE -->

        <div class="auth-container">

            <div class="auth-card">

                <div class="mobile-logo">

                    <a href="index.html" class="auth-logo">
                        Student<span>Spend</span>
                    </a>

                </div>

                <div class="auth-heading">

                    <h2>
                        Welcome back
                    </h2>

                    <p>
                        Login to your StudentSpend account.
                    </p>

                </div>


                <!-- LOGIN FORM -->

                <form id="loginForm">

                    <div class="form-group">

                        <label for="email">
                            Email address
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="you@example.com"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <div class="label-row">

                            <label for="password">
                                Password
                            </label>

                            <a href="#">
                                Forgot password?
                            </a>

                        </div>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="auth-button"
                    >
                        Login
                    </button>

                </form>


                <div class="auth-divider">

                    <span>OR</span>

                </div>


                <p class="auth-switch">

                    Don't have an account?

                    <a href="register.html">
                        Create one
                    </a>

                </p>

            </div>

        </div>

    </div>


    <script src="js/auth.js"></script>

</body>

</html>
